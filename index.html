<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kaydesigns</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f17;
      color: #e6f1ff;
    }

    /* NAVBAR */
    nav {
      display: flex;
      justify-content: space-between;
      padding: 15px 40px;
      background: #0b0f17;
      border-bottom: 1px solid #00c3ff33;
    }

    nav h1 {
      color: #00c3ff;
      text-shadow: 0 0 10px #00c3ff;
    }

    nav a {
      color: #ccc;
      text-decoration: none;
      margin-left: 20px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #00c3ff;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    .hero h2 {
      font-size: 48px;
      color: #00c3ff;
      text-shadow: 0 0 20px #00c3ff;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
    }

    /* BUTTON */
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      border: 1px solid #00c3ff;
      border-radius: 8px;
      color: #00c3ff;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00c3ff;
      color: black;
      box-shadow: 0 0 15px #00c3ff;
    }

    /* CARDS */
    .section {
      padding: 60px 40px;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #00c3ff22;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px #00c3ff33;
    }

    .card h3 {
      color: #00c3ff;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #00c3ff22;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <h1>Kaydeex</h1>
    <div>
      <a href="#">Home</a>
      <a href="#">Projects</a>
      <a href="#">About</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h2>Welcome</h2>
    <p>A clean custom site built from scratch</p>
    <a href="#" class="btn">Get Started</a>
  </section>

  <!-- SECTION -->
  <section class="section">
    <h2>What I Do</h2>

    <div class="cards">
      <div class="card">
        <h3>Web Design</h3>
        <p>Creating modern and responsive designs.</p>
      </div>

      <div class="card">
        <h3>Projects</h3>
        <p>Building structured and functional sites.</p>
      </div>

      <div class="card">
        <h3>Learning</h3>
        <p>Constantly improving and experimenting.</p>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    © 2026 Kaydeex
  </footer>

</body>
</html>
